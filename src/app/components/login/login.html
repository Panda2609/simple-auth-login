<div class="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl p-8 w-full max-w-md border-2 border-green-200">
    <!-- Título -->
    <div class="flex items-center justify-center gap-3 mb-6">
      <i class="fas fa-user text-green-700 text-3xl"></i>
      <h1 class="text-3xl font-bold text-green-700">Iniciar Sesión</h1>
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-lg">
      <p class="text-red-800 font-semibold text-sm flex items-center gap-2">
        <i class="fas fa-exclamation-circle"></i>
        {{ errorMessage }}
      </p>
    </div>
    
    <!-- Formulario -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-semibold text-green-800 mb-2 flex items-center gap-2">
          <i class="fas fa-envelope text-green-600"></i>
          Correo Electrónico
        </label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Ej: email@email.com"
          class="w-full px-4 py-2 border-2 border-green-200 rounded-lg focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition"
          [ngClass]="{
            'border-red-500 bg-red-50': submitted && f['email'].errors
          }"
        />
        <!-- Errores Email -->
        <div *ngIf="submitted && f['email'].errors" class="mt-2 text-sm text-red-600">
          <span *ngIf="f['email'].errors['required']">El email es requerido</span>
          <span *ngIf="f['email'].errors['email']">Email inválido</span>
        </div>
      </div>

      <!-- Contraseña -->
      <div>
        <label for="password" class="block text-sm font-semibold text-green-800 mb-2 flex items-center gap-2">
          <i class="fas fa-lock text-green-600"></i>
          Contraseña
        </label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Mínimo 6 caracteres"
          class="w-full px-4 py-2 border-2 border-green-200 rounded-lg focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition"
          [ngClass]="{
            'border-red-500 bg-red-50': submitted && f['password'].errors
          }"
        />
        <!-- Errores Password -->
        <div *ngIf="submitted && f['password'].errors" class="mt-2 text-sm text-red-600">
          <span *ngIf="f['password'].errors['required']">La contraseña es requerida</span>
          <span *ngIf="f['password'].errors['minlength']">Mínimo 6 caracteres</span>
        </div>
      </div>

      <!-- Botón Submit -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-2 rounded-lg transition transform hover:scale-105 active:scale-100 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <i class="fas fa-arrow-right"></i>
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <!-- Link a Registro -->
    <div class="mt-6 text-center border-t border-green-200 pt-4">
      <p class="text-gray-600">
        ¿No tienes cuenta?
        <a
          (click)="goToRegister()"
          class="text-green-600 font-semibold hover:text-green-700 cursor-pointer hover:underline"
        >
          Regístrate aquí
        </a>
      </p>
    </div>
  </div>
</div>
